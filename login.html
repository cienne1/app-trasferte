<!DOCTYPE html>
<html class="light" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Login - Gestione Trasferte</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script src="https://accounts.google.com/gsi/client" async defer></script>

<style>
    body { font-family: 'Inter', sans-serif; min-height: max(884px, 100dvh); }
    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
</style>

<script id="tailwind-config">
    tailwind.config = {
        darkMode: "class",
        theme: {
            extend: {
                "colors": {
                    "primary": "#004d64",
                    "primary-container": "#006684",
                    "on-primary-container": "#a2e1ff",
                    "surface-container-highest": "#e1e3e4",
                    "surface-container-high": "#e7e8e9",
                    "surface-container-low": "#f3f4f5",
                    "surface-container-lowest": "#ffffff",
                    "surface": "#f8f9fa",
                    "on-surface": "#191c1d",
                    "on-surface-variant": "#3f484d",
                    "outline-variant": "#bfc8cd",
                    "secondary": "#555f69",
                }
            }
        }
    }
</script>
<!-- Icona del collegamento sulla Home del telefono -->
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icona-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<!-- Fine collegamenti icona -->
</head>
<body class="bg-surface text-on-surface min-h-screen flex items-center justify-center p-6">
<div class="max-w-md w-full bg-surface-container-lowest rounded-xl overflow-hidden shadow-[0_24px_48px_-12px_rgba(0,0,0,0.08)]">
    
    <div class="p-8 md:p-12 flex flex-col justify-center items-center">
        <div class="mb-10 w-full">
            <div class="text-xl font-black text-primary uppercase tracking-widest text-center">
                Gestione Trasferte
            </div>
        </div>
        <div class="mb-8 w-full text-center">
            <h2 class="text-[1.75rem] font-bold text-primary tracking-tight mb-2">Benvenuto</h2>
            <p class="text-secondary font-medium">L'app è strettamente personale e protetta dal tuo account Google Drive.</p>
        </div>
        
        <div id="error-message" class="hidden text-red-600 text-sm font-bold bg-red-100 p-3 rounded-lg mb-6 w-full text-center">Errore durante il login. Riprova.</div>
        
        <!-- Bottone Custom Google Sign In -->
        <button onclick="loginWithGoogle()" class="w-full h-14 bg-white border border-outline-variant text-on-surface rounded-lg font-bold text-base hover:bg-surface-container-low active:scale-[0.98] transition-all shadow-md flex items-center justify-center gap-3">
            <svg version="1.1" xmlns="http://www.w3.org/2000/svg" width="24px" height="24px" viewBox="0 0 48 48" class="abcRioButtonSvg"><g><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"></path><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"></path><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"></path><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"></path><path fill="none" d="M0 0h48v48H0z"></path></g></svg>
            Accedi con Google
        </button>
        
        <div class="text-center pt-8">
            <p class="text-xs text-secondary max-w-xs mx-auto">Tutti i dati rimarranno privati sul tuo Google Drive personale.</p>
        </div>
    </div>
</div>

<script>
    const CLIENT_ID = '253094870963-jqolk1rq17j0alclckih0ppj3240mcv6.apps.googleusercontent.com';
    let tokenClient;

    window.onload = function() {
        if(localStorage.getItem('userLoggedIn') === 'true' && localStorage.getItem('googleAccessToken')) {
            window.location.href = 'index.html';
        }
        
        // Inizializza il client OAuth2 di Google per richiedere l'Access Token
        tokenClient = google.accounts.oauth2.initTokenClient({
            client_id: CLIENT_ID,
            scope: 'https://www.googleapis.com/auth/drive.file https://www.googleapis.com/auth/userinfo.email https://www.googleapis.com/auth/userinfo.profile',
            callback: (tokenResponse) => {
                if (tokenResponse && tokenResponse.access_token) {
                    // Token ricevuto con successo!
                    localStorage.setItem('googleAccessToken', tokenResponse.access_token);
                    
                    // Recuperiamo i dati dell'utente (email e nome)
                    fetch('https://www.googleapis.com/oauth2/v3/userinfo', {
                        headers: { Authorization: 'Bearer ' + tokenResponse.access_token }
                    })
                    .then(res => res.json())
                    .then(profile => {
                        localStorage.setItem('userLoggedIn', 'true');
                        localStorage.setItem('userEmail', profile.email);
                        localStorage.setItem('userName', profile.name);
                        window.location.href = 'index.html';
                    })
                    .catch(err => {
                        console.error("Errore recupero info utente:", err);
                        document.getElementById('error-message').classList.remove('hidden');
                    });
                }
            },
            error_callback: (error) => {
                console.error("Errore OAuth:", error);
                document.getElementById('error-message').innerText = "Errore durante l'autenticazione. Dettagli: " + error.type;
                document.getElementById('error-message').classList.remove('hidden');
            }
        });
    };

    function loginWithGoogle() {
        // Avvia il flusso OAuth
        tokenClient.requestAccessToken({prompt: 'select_account'});
    }
</script>
</body>
</html>
